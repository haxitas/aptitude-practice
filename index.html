  <script>
    // 見張り: アプリの起動(モジュールの読み込み)に失敗したら、真っ暗にせず再読み込みを勧める。
    // モジュールより先に動くよう、普通の script にしている。起動した後のエラーには反応しない。
    (function () {
      var shown = false;
      function showReload() {
        if (shown || window.aptBooted) return;
        shown = true;
        var box = document.createElement('section');
        box.className = 'screen boot-error';
        box.setAttribute('role', 'alert');
        var message = document.createElement('p');
        message.textContent = 'アプリが更新されました。再読み込みしてください';
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-primary btn-large';
        button.textContent = '再読み込み';
        button.addEventListener('click', function () { location.reload(); });
        box.append(message, button);
        document.body.replaceChildren(box);
      }
      window.aptBootFailed = showReload;
      // 起動前の読み込みエラー(モジュールの構文・export の不一致、ファイルの取得失敗など)
      window.addEventListener('error', function () { showReload(); }, true);
      window.addEventListener('unhandledrejection', function () { showReload(); });
    })();
  </script>
